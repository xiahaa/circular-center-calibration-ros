name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .

  ros-noetic:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Install system dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3-numpy python3-opencv python3-pip python3-pytest python3-yaml \
            ros-noetic-cv-bridge ros-noetic-message-filters ros-noetic-tf2-ros
      - uses: actions/checkout@v7
      - name: Install circular-center core
        shell: bash
        run: |
          python3 -m pip install \
            "git+https://github.com/xiahaa/circular-center-calibration.git@v0.1.0"
      - name: Build and test catkin package
        shell: bash
        run: |
          mkdir -p /tmp/circular_center_ws/src
          cp -a "$GITHUB_WORKSPACE" \
            /tmp/circular_center_ws/src/circular_center_calibration_ros
          ln -s /opt/ros/noetic/share/catkin/cmake/toplevel.cmake \
            /tmp/circular_center_ws/src/CMakeLists.txt
          source /opt/ros/noetic/setup.bash
          cd /tmp/circular_center_ws
          catkin_make
          catkin_make run_tests_circular_center_calibration_ros
          catkin_test_results
